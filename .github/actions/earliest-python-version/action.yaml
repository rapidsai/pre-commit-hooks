name: earliest-python-version
description: Get earliest supported Python version
outputs:
  python-version:
    value: ${{ steps.read-pyproject-toml.outputs.python-version }}

runs:
  using: composite
  steps:
    - id: read-pyproject-toml
      shell: bash
      run: |
        sed -n -E '/^requires-python = / { s/^requires-python = ">=([0-9]+\.[0-9]+(\.[0-9]+)?)"$/python-version=\1/p; q 0 }; $ q 1' pyproject.toml | tee -a "$GITHUB_OUTPUT"
