- id: verify-alpha-spec
  name: verify-alpha-spec
  description: make sure RAPIDS packages have correct alpha spec
  entry: verify-alpha-spec
  language: python
  files: (^|/)dependencies[.]yaml$
  additional_dependencies:
    - --extra-index-url=https://pypi.anaconda.org/rapidsai-wheels-nightly/simple
    - .[alpha-spec]
- id: verify-codeowners
  name: verify-codeowners
  description: make sure .github/CODEOWNERS file is correct
  entry: verify-codeowners
  language: python
  files:
    (?x)
      ^[.]github/CODEOWNERS$
- id: verify-copyright
  name: verify-copyright
  description: make sure copyright headers are up to date
  entry: verify-copyright
  language: python
  files: |
    (?x)
      [.](cmake|cpp|cu|cuh|h|hpp|sh|pxd|py|pyx|rs|java)$|
      (^|/)CMakeLists[.]txt$|
      (^|/)CMakeLists_standalone[.]txt$|
      (^|/)meta[.]yaml$|
      (^|/)pyproject[.]toml$|
      (^|/)setup[.]cfg$
- id: verify-dependencies
  name: verify-dependencies
  description: make sure dependencies.yaml follows RAPIDS conventions
  entry: verify-dependencies
  language: python
  files: (^|/)dependencies[.]yaml$
  additional_dependencies:
    - --extra-index-url=https://pypi.anaconda.org/rapidsai-wheels-nightly/simple
    - .[dependencies]
- id: verify-hardcoded-version
  name: verify-hardcoded-version
  description: make sure RAPIDS version is not hard-coded in files
  entry: verify-hardcoded-version
  language: python
  exclude: |
    (?x)
      (^|/)devcontainer[.]json$|
      (^|/)dependencies[.]yaml$|
      ^[.]github/(workflows|ISSUE_TEMPLATE)/|
      (^|/)pom[.]xml$|
      ^[.]pre-commit-config[.]yaml$|
      ^conda/environments/|
      (^|/)VERSION$|
      (^|/)RAPIDS_BRANCH$|
      [.](md|rst|avro|parquet|png|orc|gz|pkl|sas7bdat)$
- id: verify-pyproject-license
  name: verify-pyproject-license
  description: make sure pyproject.toml license is correct
  entry: verify-pyproject-license
  language: python
  files: |
    (?x)
      (^|/)pyproject[.]toml$
